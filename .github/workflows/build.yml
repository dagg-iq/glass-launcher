name: Build Glass Launcher APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses and Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: List Generated APKs
        run: find . -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-debug-apk
          path: "**/*.apk"
          retention-days: 7

      - name: Publish APK to Release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find . -name "*-debug.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          gh release delete-asset v1.0 app-debug.apk -y || true
          gh release upload v1.0 "$APK_PATH" --clobber || \
          gh release create v1.0 "$APK_PATH" --title "Glass Launcher v1.0" --notes "Latest build"
          gh release edit v1.0 --notes "Glass Launcher with iOS 18 Liquid Glass Icon Engine. Built at $(date -u)" || true
